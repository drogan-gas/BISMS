<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BISMS 鍋爐安裝與工程監理系統</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="gasFrame" src="about:blank" allow="camera; microphone; geolocation"></iframe>

    <script>
        (function() {
            const gasBaseUrl = "https://script.google.com/macros/s/AKfycbwOJUVdnJtiBwPVecqhn9NOZnFaI2AfoOnNf-yrPL38zlBtvIlYL65ffHqMEwTUFnBd/exec";
            
            // 取得目前的網址參數並穿透至 iframe
            const currentSearch = window.location.search;
            const iframeUrl = gasBaseUrl + currentSearch;
            
            document.getElementById('gasFrame').src = iframeUrl;
        })();
    </script>
</body>
</html>
